# Zakadi repository standard: git hooks (lefthook 2.x), Swift with SwiftPM (iOS).
# These are the commands .github/workflows/ci.yml runs; a change here is a change there.
# Install: brew install lefthook swiftlint, then lefthook install. "swift format" is
# the formatter bundled with the Swift 6 toolchain.

pre-commit:
  jobs:
    - name: ascii
      run: '! LC_ALL=C grep -nHI "[^[:print:][:space:]]" {staged_files}'
    - name: secrets
      glob: "**/.env*"
      run: 'echo "secrets: {staged_files} must not be committed (spec 00 0.11)" >&2; exit 1'
    - name: checks
      group:
        parallel: true
        jobs:
          - name: format
            glob: "*.swift"
            run: swift format lint --strict {staged_files}
          - name: lint
            glob: "*.swift"
            run: swiftlint lint --strict {staged_files}

commit-msg:
  # git writes the message on merge and rebase.
  skip:
    - merge
    - rebase
  jobs:
    - name: message
      run: |
        f="{1}"
        if LC_ALL=C grep -nH "[^[:print:][:space:]]" "$f"; then
          echo "commit message: ASCII only" >&2; exit 1
        fi
        if grep -iEq "^(co-authored-by|claude-session|generated-by):|claude\.ai/code|generated by" "$f"; then
          echo "commit message: no attribution trailer or footer" >&2; exit 1
        fi
        if [ "$(head -n 1 "$f" | wc -c)" -gt 73 ]; then
          echo "commit message: subject over 72 characters" >&2; exit 1
        fi

pre-push:
  jobs:
    # The iOS simulator build of the lint job: the host build does not compile for iOS.
    - name: types
      run: xcodebuild build -scheme ZakadiSDK -destination 'generic/platform=iOS Simulator'
    - name: unit
      run: scripts/fetch-vectors.sh && swift build && swift test
