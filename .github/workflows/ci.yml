# Zakadi repository standard: ci.yml for a Swift package (iOS).
# The commands are the ones in lefthook.yml. "swift format" ships with the Swift 6
# toolchain on the macOS runner; SwiftLint and XcodeGen come from Homebrew. The lint job
# also builds the package and the probe app for the iOS simulator, which the host build
# does not compile for; XcodeGen writes the app's project from Probe/project.yml first.
# The unit job fetches the zakadi-protocol vectors the tests run. The integration job runs
# the package's simulator test target and the probe app's unit tests on one simulator.
# The lint job ends with the scan (CI only, references/GITHUB.md). SwiftPM has no audit
# command and osv-scanner does not read Package.resolved, so the scan reads the pins
# itself: the licence GitHub detects for each pinned repository against the excluded list
# of spec 00 0.10, then one OSV query batch (the database osv-scanner uses) for the pinned
# versions.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift format lint --strict --recursive Package.swift Sources Tests Probe

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install swiftlint xcodegen
      - run: swiftlint lint --strict
      - run: xcodebuild build -scheme ZakadiSDK -destination 'generic/platform=iOS Simulator'
      - run: xcodegen generate --spec Probe/project.yml --project Probe
      - run: xcodebuild build -project Probe/ZakadiProbe.xcodeproj -scheme ZakadiProbe -destination 'generic/platform=iOS Simulator'
      - name: scan
        shell: bash
        env:
          EXCLUDED_LICENCES: '(^|[^[:alnum:]])(A?GPL|SSPL|RSAL)|GNU (Affero )?General Public|Server Side Public|Redis Source Available|-NC([^[:alnum:]]|$)|[Nn]on[- ]?[Cc]ommercial|FoxIO'
          GH_TOKEN: ${{ github.token }}
        run: |
          swift package resolve
          if [ ! -f Package.resolved ]; then
            echo "scan: no pinned dependencies"
            exit 0
          fi
          jq -r '.pins[].location' Package.resolved | while read -r url; do
            repo=${url#https://github.com/}
            repo=${repo%.git}
            licence=$(gh api "repos/$repo/license" --jq .license.spdx_id 2>/dev/null) || licence=unknown
            echo "$repo $licence"
          done | tee "$RUNNER_TEMP/licences.txt"
          if grep -E "$EXCLUDED_LICENCES" "$RUNNER_TEMP/licences.txt"; then
            echo "scan: a licence excluded by spec 00 0.10 is listed above" >&2
            exit 1
          fi
          jq '{queries: [.pins[] | select(.state.version) | {package: {ecosystem: "SwiftURL", name: (.location | sub("^https://"; "") | sub("\\.git$"; ""))}, version: .state.version}]}' Package.resolved > "$RUNNER_TEMP/osv-query.json"
          curl -fsS --data @"$RUNNER_TEMP/osv-query.json" https://api.osv.dev/v1/querybatch \
            | jq -r --slurpfile q "$RUNNER_TEMP/osv-query.json" '[$q[0].queries, (.results // [])] | transpose[] | select(.[1].vulns) | "\(.[0].package.name) \(.[0].version) \([.[1].vulns[].id] | join(" "))"' \
            | tee "$RUNNER_TEMP/vulnerabilities.txt"
          if [ -s "$RUNNER_TEMP/vulnerabilities.txt" ]; then
            echo "scan: the pinned versions above have known vulnerabilities (OSV)" >&2
            exit 1
          fi

  unit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/fetch-vectors.sh
      - run: swift build
      - run: swift test

  integration:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: simulator
        run: echo "SIMULATOR=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')" >> "$GITHUB_ENV"
      - run: xcodebuild test -scheme ZakadiSDK-Package -destination "platform=iOS Simulator,name=$SIMULATOR" -only-testing:ZakadiSDKIntegrationTests
      - run: brew install xcodegen
      - run: xcodegen generate --spec Probe/project.yml --project Probe
      - run: xcodebuild test -project Probe/ZakadiProbe.xcodeproj -scheme ZakadiProbe -destination "platform=iOS Simulator,name=$SIMULATOR" -only-testing:ZakadiProbeTests
