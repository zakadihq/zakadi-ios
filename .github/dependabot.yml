# Zakadi repository standard: Dependabot.
# One entry per ecosystem the repository contains: the Swift package at the root and
# the workflows.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    groups:
      swift-minor-and-patch:
        update-types: ["minor", "patch"]
